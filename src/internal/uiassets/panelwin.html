<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ssh_tunnel</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
<style>
  /* Окно «Панель сервера»: пока оно открыто, держится проброс к панели
     (аренда, /api/panelfwd op ping); закрыли окно — проброс закрылся. */
  body{margin:0}
  .pw{padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
  .pw h1{font-size:18px;margin:0;line-height:1.3}
  .pw .st{font-size:13.5px;color:var(--dim)}
  .pw .st.ok{color:var(--ok)}
  .pw .st.err{color:var(--err)}
  .url{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
       border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:14px;word-break:break-all;
       user-select:all;-webkit-user-select:all}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;
       color:var(--text);font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .cred{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
  .cred b{font-family:var(--mono);user-select:all;-webkit-user-select:all}
  .cred .row{margin-top:8px}
  .note{font-size:12.5px;color:var(--dim);line-height:1.5}
</style>
</head>
<body>
<div class="pw">
  <h1 id="title"></h1>
  <div class="st" id="st"></div>
  <div id="live" hidden>
    <div class="url" id="url"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="openBtn"></button>
      <button class="btn" id="copyBtn"></button>
    </div>
  </div>
  <div class="cred" id="cred" hidden>
    <div><span id="loginLbl"></span> <b id="login"></b></div>
    <div style="margin-top:4px"><span id="passLbl"></span> <b id="pass"></b></div>
    <div class="row"><button class="btn" id="copyPass"></button></div>
  </div>
  <p class="note" id="note"></p>
  <div class="row"><button class="btn" id="closeBtn"></button></div>
</div>
<script src="pages.js"></script>
<script>
const ID = Q.get('id') || '';
const ADMIN = Q.get('admin') || '';
const NAME = Q.get('name') || '';
// Логин и одноразовый пароль панели — во фрагменте адреса (#): он не уходит
// ни в один запрос, это только подпись в окне.
const H = new URLSearchParams(location.hash.slice(1));

document.title = L('Панель сервера', 'Server panel') + (NAME ? ' — ' + NAME : '');
$('title').textContent = L('Панель сервера', 'Server panel') + (NAME ? ' «' + NAME + '»' : '');
$('openBtn').textContent = L('Открыть в браузере', 'Open in browser');
$('copyBtn').textContent = L('Скопировать адрес', 'Copy address');
$('closeBtn').textContent = L('Закрыть доступ к панели', 'Close access to the panel');
$('loginLbl').textContent = L('Логин:', 'Login:');
$('passLbl').textContent = L('Одноразовый пароль:', 'One-time password:');
$('copyPass').textContent = L('Скопировать пароль', 'Copy password');
$('note').textContent = L('Пока это окно открыто, панель сервера доступна на этом компьютере по адресу выше. ' +
  'Закроешь окно — доступ закроется. Открыть снова — кнопка «Открыть панель сервера» в настройках сервера.',
  'While this window is open, the server panel is reachable on this computer at the address above. ' +
  'Close the window and the access closes. To open it again — «Open server panel» in the server settings.');

if(H.get('p')){
  $('cred').hidden = false;
  $('login').textContent = H.get('l') || 'admin';
  $('pass').textContent = H.get('p');
}

let url = '', pingT = 0, closed = false;
function setSt(text, cls){ $('st').textContent = text; $('st').className = 'st' + (cls ? ' ' + cls : ''); }
function showClosed(reason){
  closed = true;
  clearInterval(pingT);
  $('live').hidden = true;
  setSt(L('Доступ к панели закрыт', 'Access to the panel is closed') + (reason ? ': ' + reason : ''), 'err');
}

async function copy(text, btn){
  try {
    if(ANDROID && window.SSHTunnelAndroid.writeClipboard) window.SSHTunnelAndroid.writeClipboard(text);
    else await navigator.clipboard.writeText(text);
    const t = btn.textContent;
    btn.textContent = L('Скопировано', 'Copied');
    setTimeout(() => { btn.textContent = t; }, 1200);
  } catch(e) {}
}

async function start(){
  setSt(L('Открываю доступ к панели…', 'Opening access to the panel…'));
  let r;
  try { r = await api('/api/panelfwd', {op: 'open', id: ID, adminUser: ADMIN, window: true}); }
  catch(e) { r = {error: String(e)}; }
  if(!r || r.error || !r.open){
    setSt((r && r.error) || L('Не удалось открыть доступ к панели', 'Could not open access to the panel'), 'err');
    return;
  }
  url = r.url;
  $('url').textContent = url;
  $('live').hidden = false;
  setSt(L('Панель доступна', 'The panel is reachable'), 'ok');
  openExternal(url);
  pingT = setInterval(async () => {
    let st;
    try { st = await api('/api/panelfwd', {op: 'ping'}); } catch(e) { return; }
    if(st && !st.open && !closed) showClosed(st.closed || '');
  }, 4000);
}

$('openBtn').onclick = () => { if(url) openExternal(url); };
$('copyBtn').onclick = () => { if(url) copy(url, $('copyBtn')); };
$('copyPass').onclick = () => copy($('pass').textContent, $('copyPass'));
$('closeBtn').onclick = async () => {
  try { await api('/api/panelfwd', {op: 'close'}); } catch(e) {}
  showClosed('');
  closePage();
};
start();
</script>
</body>
</html>
